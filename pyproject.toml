[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-exp-app"
version = "0.2.0"
description = "Local experiment workbench for SSH GPU training, cached charts and comparison tables"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "remote"]
testpaths = ["tests"]
markers = ["remote: isolated GPU host integration"]
