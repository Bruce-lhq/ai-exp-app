name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Local backend (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Ubuntu 24.04 x64
            os: ubuntu-24.04
            python: .venv/bin/python
          - target: Windows Server 2025 x64
            os: windows-2025
            python: .venv/Scripts/python.exe
          - target: macOS Apple Silicon
            os: macos-15
            python: .venv/bin/python
          - target: macOS Intel
            os: macos-15-intel
            python: .venv/bin/python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install locked dependencies
        run: |
          uv venv --python 3.12
          uv pip sync --python "${{ matrix.python }}" requirements.lock
          uv pip install --python "${{ matrix.python }}" --no-deps -e .
      - name: Run pytest
        run: '"${{ matrix.python }}" -m pytest -q'
      - name: Build remote agent without connecting to SSH
        run: '"${{ matrix.python }}" scripts/install_remote.py --build-only'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser regressions
        run: npm run test:e2e
      - name: Run iPhone viewport regressions in WebKit
        run: npm run test:e2e -- --browser=webkit tests/mobile_workbench.spec.ts
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
