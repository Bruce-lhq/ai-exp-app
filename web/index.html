<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f5f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Experiment" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <title>AI Experiment</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("appearance.theme");
          document.documentElement.dataset.theme = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        } catch (_) {}
        function showFailure() {
          var message = document.getElementById("startup-message");
          if (message) message.textContent = "页面尚未加载完成。请检查网络和 SSH 转发，重新连接后点击重试。";
        }
        window.addEventListener("error", function (event) {
          if (event.message || (event.target && event.target.tagName === "SCRIPT")) showFailure();
        }, true);
        setTimeout(showFailure, 10000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="padding:32px;font:16px system-ui;color:var(--text);background:var(--background);min-height:100vh;box-sizing:border-box">
        <h1 style="font-size:24px">AI Experiment</h1>
        <p id="startup-message" role="status">正在加载工作台…</p>
        <a href="/">重新加载</a>
        <noscript><p>浏览器已禁用 JavaScript，请启用后重新加载。</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
